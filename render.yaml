services:
  - type: web
    name: ai-test-workflow-copilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: OpenAI__ApiKey
        sync: false
      - key: OpenAI__Model
        value: gpt-4.1-mini
      - key: GitHub__Token
        sync: false
