services:
  api:
    build: ./backend/AIWorkflow.Api
    environment:
      ASPNETCORE_URLS: http://+:5080
      GitHub__Token: ${GITHUB_TOKEN}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "5080:5080"

  ui:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - api